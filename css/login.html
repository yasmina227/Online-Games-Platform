<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="container">
        <div class="form-box">
            <h2>Welcome Back</h2>
            <p class="subtitle">Please enter your credentials to log in.</p>

            <form class="form" id="signupform">

                <!-- Email Address -->
                <div class="input-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" class="input" placeholder="example@mail.com" required>
                    <small id="emailError" style="color: red;"></small>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" class="input" placeholder="Enter your password" required>
                    <small id="passwordError" style="color: red;"></small>
                </div>

                <!-- Remember Me & Forgot Password Options -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn">Log In</button>

            </form>

            <p class="signup-link">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </p>
        </div>
    </div>
    <script src="log.js"></script>
</body>

</html>
