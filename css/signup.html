<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="container">
        <h2>Create Account</h2>
        <p class="subtitle">Please fill in your details to get started</p>

        <form class="form-box">


            <div class="input-group">
                <label for="fullname">Full Name <span class="required">*</span></label>
                <input type="text" id="fullname" class="input" placeholder="Enter your full name" required>
            </div>


            <div class="input-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" class="input" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password <span class="required">*</span></label>
                <input type="password" id="password" class="input" placeholder="Enter password" required>
            </div>


            <div class="input-group">
                <label for="age-category">Age Category <span class="required">*</span></label>
                <select id="age-category" class="input" required>
                    <option value="" disabled selected>-- Select your age --</option>
                    <option value="under15">Under 15 years old</option>
                    <option value="15plus">15 years old or above (15+)</option>
                </select>
            </div>


            <button type="submit" class="btn">Sign Up</button>

        </form>
    </div>

</body>

</html>
